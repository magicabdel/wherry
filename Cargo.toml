[package]
name = "wherry"
version = "0.1.0"
edition = "2021"
description = "Configure kubectl access to (private) EKS clusters via an automatic bastion bridge"
license = "MIT"
authors = ["Abdessalam ZAIMI <abdessalam@zaimi.dev>"]
repository = "https://github.com/magicabdel/wherry"
readme = "README.md"
exclude = [".github/", "docs/", "install.sh"]

[[bin]]
name = "wherry"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
dialoguer = "0.11"
ssh-key = { version = "0.6", features = ["ed25519", "getrandom"] }
russh = "0.61"
daemonize = "0.5"
sha1 = "0.10"

# self-update (sha2, flate2 and hex are already in the tree via the AWS SDK)
ureq = "2"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"

aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-eks = "1"
aws-sdk-autoscaling = "1"
aws-sdk-ec2instanceconnect = "1"
aws-sdk-elasticloadbalancingv2 = "1"
aws-sdk-resourcegroupstagging = "1"

[profile.release]
strip = true
lto = true
